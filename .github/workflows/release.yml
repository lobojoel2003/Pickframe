name: Release

# Push a tag such as v1.2.3 (matching src/pickframe/__init__.py and a
# "## [1.2.3]" section in CHANGELOG.md) to build and publish a release.
# The workflow run number becomes the build number of every artifact.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release again (e.g. v1.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUILD: ${{ github.run_number }}
  FORCE_COLOR: "1"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: Verify version and run tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check tag, version and changelog
        id: version
        run: python tools/stamp_build.py --check-tag "$TAG" --build "$BUILD" --no-write --github-output
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  python-dist:
    name: Python package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stamp and build
        run: |
          python tools/stamp_build.py --build "$BUILD" --channel release
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  binaries:
    name: Desktop app (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt/XCB libraries (bundled into the app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libfuse2
      - name: Stamp build metadata
        shell: bash
        run: |
          python tools/stamp_build.py --build "$BUILD" --channel release \
            --windows-version-file packaging/pyinstaller/version_info.txt
      - name: Install Pickframe and PyInstaller
        run: python -m pip install ".[all]" "pyinstaller>=6.10"
      - name: Build with PyInstaller
        shell: bash
        env:
          PICKFRAME_BUILD: ${{ env.BUILD }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export PICKFRAME_VERSION_FILE="$PWD/packaging/pyinstaller/version_info.txt"; fi
          pyinstaller packaging/pyinstaller/pickframe.spec --noconfirm --log-level WARN
      - name: Smoke test the frozen app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then CLI=dist/Pickframe.app/Contents/MacOS/pickframe-cli; else CLI=dist/Pickframe/pickframe-cli; fi
          "$CLI" --version
          "$CLI" cull tests/data --dry-run --list
          "$CLI" --version | grep -q "build $BUILD"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          tar -C dist -czf "artifacts/Pickframe-$VERSION-linux-x86_64.tar.gz" Pickframe
          packaging/linux/build_appimage.sh dist/Pickframe "artifacts/Pickframe-$VERSION-linux-x86_64.AppImage"
          "artifacts/Pickframe-$VERSION-linux-x86_64.AppImage" --appimage-extract-and-run cli --version
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist\Pickframe -DestinationPath "artifacts\Pickframe-$env:VERSION-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DAppBuild=$env:BUILD" "/DSourceDir=$PWD\dist\Pickframe" `
            "/DOutputName=Pickframe-$env:VERSION-windows-x64-setup" packaging\windows\pickframe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\Pickframe-$env:VERSION-windows-x64-setup.exe" artifacts\
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          packaging/macos/make_dmg.sh dist/Pickframe.app "artifacts/Pickframe-$VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [verify, python-dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          python tools/stamp_build.py --no-write --release-notes notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (installer) | \`Pickframe-$VERSION-windows-x64-setup.exe\` |"
            echo "| Windows 10/11 (portable) | \`Pickframe-$VERSION-windows-x64.zip\` |"
            echo "| macOS 14+ (Apple silicon) | \`Pickframe-$VERSION-macos-arm64.dmg\` |"
            echo "| Linux x86_64 (AppImage) | \`Pickframe-$VERSION-linux-x86_64.AppImage\` |"
            echo "| Linux x86_64 (folder) | \`Pickframe-$VERSION-linux-x86_64.tar.gz\` |"
            echo "| Python 3.10+ (any OS) | \`pip install pickframe-$VERSION-py3-none-any.whl\` |"
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`. The macOS app is not notarised: right-click it and choose **Open** the first time."
            echo
            echo "Build $BUILD from commit ${GITHUB_SHA::7}."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pickframe ${{ env.VERSION }}
          body_path: notes.md
          files: artifacts/*
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ !contains(env.TAG, '-') }}
          fail_on_unmatched_files: true

  pypi:
    name: Publish to PyPI
    # Opt in: set the repository variable PYPI_PUBLISH to "true" and configure
    # a trusted publisher for this workflow and the "pypi" environment on PyPI.
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
